<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Radio Minimalista PWA v2.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --text: #e8e8e8;
      --muted: #8a8a8a;
      --btn: #1a1a1a;
      --btn-hover: #252525;
      --btn-active: #333333;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    /* CARRUSEL 3D (6 CATEGORÍAS) */
    .carousel-container {
      position: relative;
      width: 100%;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }
    .box {
      position: relative;
      width: 140px;
      height: 140px;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform: rotateY(0deg);
    }
    .box span {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform-origin: center;
      transform-style: preserve-3d;
      transform: rotateY(calc(var(--i) * 60deg)) translateZ(210px);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card {
      width: 100%; height: 100%;
      background: rgba(22, 22, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      cursor: pointer;
    }
    .card .icon { width: 34px; height: 34px; color: #ffffff; opacity: 0.85; }
    .card .title { font-size: 12px; font-weight: 500; color: #cccccc; text-align: center; }

    /* REPRODUCTOR */
    .radio {
      width: 100%; max-width: 320px;
      padding: 20px 24px 0 24px;
      display: flex; flex-direction: column;
      align-items: center; gap: 18px;
    }
    .frequency { font-size: 68px; font-weight: 200; font-variant-numeric: tabular-nums; }
    .station { font-size: 13px; color: var(--muted); text-align: center; max-width: 280px; height: 18px; }
    .controls { display: flex; align-items: center; gap: 28px; }
    .btn {
      width: 54px; height: 54px; border: none; border-radius: 50%;
      background: var(--btn); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--btn-hover); }
    .btn:active { background: var(--btn-active); transform: scale(0.95); }
    .btn-power { width: 62px; height: 62px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .btn-power.playing { background: #ffffff; color: #000000; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); }
    .status { font-size: 12px; color: var(--muted); min-height: 16px; }
    svg { width: 22px; height: 22px; }
    .btn-power svg { width: 26px; height: 26px; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 0.9; } 100% { opacity: 0.3; } }
    .loading { animation: pulse 1.4s infinite ease-in-out; }
  </style>
</head>
<body>

  <!-- CARRUSEL 3D (6 CATEGORÍAS) -->
  <div class="carousel-container" id="carousel">
    <div class="box" id="box">
      <!-- 0: Música Clásica (ACTIVA) -->
      <span style="--i:0;">
        <div class="card">
          <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <p class="title">Música Clásica</p>
        </div>
      </span>
      <!-- 1: Audiolibros (VACÍA / GENÉRICA) -->
      <span style="--i:1;">
        <div class="card">
          <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
          <p class="title">Audiolibros</p>
        </div>
      </span>
      <!-- 2: Noticias (ACTIVA) -->
      <span style="--i:2;">
        <div class="card">
          <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-3 14H5c-.55 0-1-.45-1-1s.45-1 1-1h12c.55 0 1 .45 1 1s-.45 1-1 1zm0-4H5c-.55 0-1-.45-1-1s.45-1 1-1h12c.55 0 1 .45 1 1s-.45 1-1 1z"/></svg>
          <p class="title">Noticias</p>
        </div>
      </span>
      <!-- 3: Podcasts / Diálogos (VACÍA / GENÉRICA) -->
      <span style="--i:3;">
        <div class="card">
          <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2z"/></svg>
          <p class="title">Podcasts</p>
        </div>
      </span>
      <!-- 4: Lo-Fi / Ambient (ACTIVA) -->
      <span style="--i:4;">
        <div class="card">
          <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93z"/></svg>
          <p class="title">Lo-Fi / Ambient</p>
        </div>
      </span>
      <!-- 5: Miscelánea (VACÍA / GENÉRICA) -->
      <span style="--i:5;">
        <div class="card">
          <svg viewBox="0 0 24 24" class="icon"><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
          <p class="title">Miscelánea</p>
        </div>
      </span>
    </div>
  </div>

  <!-- INTERFAZ REPRODUCTOR -->
  <div class="radio">
    <div class="frequency" id="frequency">88.1</div>
    <div class="station" id="station">Cargando...</div>

    <div class="controls">
      <button class="btn" id="prev" aria-label="Anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 20L9 12l10-8v16z"/><path d="M5 19V5"/></svg>
      </button>
      <button class="btn btn-power" id="power" aria-label="Encender / Apagar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>
      </button>
      <button class="btn" id="next" aria-label="Siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg>
      </button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <audio id="audio" crossorigin="anonymous" preload="none"></audio>

  <script>
    // LISTAS CONFIGURABLES POR CATEGORÍA
    const CATEGORIES_STATIONS = {
      0: [ // 0: Música Clásica (ACTIVA)
        { name: "Radio Swiss Classic", frequency: 88.1, stream: "https://stream.srg-ssr.ch/m/rsc_de/mp3_128" },
        { name: "Classic FM", frequency: 89.4, stream: "https://media-ice.musicradio.com/ClassicFMMP3" }
      ],
      1: [ // 1: Audiolibros (GENÉRICA)
        { name: "Emisora por configurar", frequency: 90.0, stream: "" }
      ],
      2: [ // 2: Noticias (ACTIVA)
        { name: "BBC World Service", frequency: 98.3, stream: "https://stream.live.vc.bbcmedia.co.uk/bbc_world_service" },
        { name: "RFI Español", frequency: 99.1, stream: "https://stream.rfi.fr/rfienespagnol/all/rfienespagnol-64k.mp3" }
      ],
      3: [ // 3: Podcasts (GENÉRICA)
        { name: "Emisora por configurar", frequency: 100.0, stream: "" }
      ],
      4: [ // 4: Lo-Fi / Ambient (ACTIVA)
        { name: "SomaFM Drone Zone", frequency: 102.5, stream: "https://ice5.somafm.com/dronezone-128-mp3" }
      ],
      5: [ // 5: Miscelánea (GENÉRICA)
        { name: "Emisora por configurar", frequency: 106.0, stream: "" }
      ]
    };

    let currentCategory = 0;
    let stationIndex = 0;
    let playing = false;
    let degrees = 0;

    const freq = document.getElementById("frequency");
    const nameEl = document.getElementById("station");
    const status = document.getElementById("status");
    const audio = document.getElementById("audio");
    const power = document.getElementById("power");
    const box = document.getElementById("box");
    const carousel = document.getElementById("carousel");

    function getActiveStations() {
      return CATEGORIES_STATIONS[currentCategory] || CATEGORIES_STATIONS[0];
    }

    function updateStationDisplay() {
      const stations = getActiveStations();
      if (stationIndex >= stations.length) stationIndex = 0;
      const current = stations[stationIndex];
      freq.textContent = current.frequency.toFixed(1);
      nameEl.textContent = current.name;
    }

    function stopPlayback() {
      playing = false;
      power.classList.remove("playing");
      audio.pause();
      audio.src = "";
      status.textContent = "";
      status.classList.remove("loading");
    }

    function startPlayback() {
      const stations = getActiveStations();
      const current = stations[stationIndex];

      if (!current.stream) {
        status.textContent = "Sin señal disponible";
        return;
      }

      playing = true;
      power.classList.add("playing");
      status.textContent = "Conectando…";
      status.classList.add("loading");

      audio.src = current.stream;
      audio.load();
      audio.play().catch(e => {
        if (e.name !== 'AbortError') {
          status.textContent = "Sin señal";
          status.classList.remove("loading");
          stopPlayback();
        }
      });
    }

    document.getElementById("prev").onclick = () => {
      const stations = getActiveStations();
      stationIndex = (stationIndex - 1 + stations.length) % stations.length;
      updateStationDisplay();
      if (playing) startPlayback();
    };

    document.getElementById("next").onclick = () => {
      const stations = getActiveStations();
      stationIndex = (stationIndex + 1) % stations.length;
      updateStationDisplay();
      if (playing) startPlayback();
    };

    power.onclick = () => {
      if (!playing) startPlayback();
      else stopPlayback();
    };

    audio.onplaying = () => {
      status.textContent = "";
      status.classList.remove("loading");
    };

    function rotateCarousel(dir) {
      stopPlayback();
      degrees -= dir * 60; // 360deg / 6 = 60deg
      box.style.transform = `rotateY(${degrees}deg)`;

      let normalized = ((degrees / -60) % 6 + 6) % 6;
      currentCategory = Math.round(normalized);
      stationIndex = 0;

      updateStationDisplay();
    }

    let startX = 0;
    carousel.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
    carousel.addEventListener('touchend', (e) => {
      let endX = e.changedTouches[0].clientX;
      if (startX - endX > 45) rotateCarousel(1);
      else if (endX - startX > 45) rotateCarousel(-1);
    }, { passive: true });

    updateStationDisplay();
  </script>
</body>
</html>
